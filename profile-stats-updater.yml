name: Update GitHub Stats

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour, you can adjust the schedule as needed

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yourusername
          template: classic
          base: headers, activity, community, repositories, metadata
          config_timezone: yourtimezone
